[package]
name = "iroh-098-interop-peer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
iroh = "=0.98.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
