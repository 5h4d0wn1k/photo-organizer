name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust service
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libsecret-1-dev
      - name: Format
        run: cargo fmt --check
      # clippy and test must see the same feature set, or "green locally" and
      # "green in CI" test different code. scripts/dev-check.sh uses these exact
      # flags (issue #84).
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-features --locked

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Outdated report
        run: flutter pub outdated
        continue-on-error: true

  # Android breakage used to be invisible until someone cut a tag: analyze and
  # unit tests never touch Gradle, so a Kotlin/AGP/manifest mistake shipped all
  # the way to release. A debug assemble is the cheapest build that exercises
  # the whole Android toolchain, and it needs no signing material.
  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Same action and the same `cache: true` as release.yml's four Android
      # jobs, deliberately: a build path that differs between CI and release is
      # a build path that is not proven. No extra third-party action is
      # introduced -- ubuntu-latest already ships a JDK and the Android SDK, and
      # flutter-action's cache covers both pub and Gradle.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Assemble debug APK
        run: flutter build apk --debug
      # Proof the build produced an installable-shaped artifact rather than a
      # zero-byte file that Gradle reported success on.
      - name: Verify the APK exists and is non-trivial
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          if [[ ! -f "${apk}" ]]; then
            echo "::error::expected ${apk} to exist after flutter build apk --debug" >&2
            exit 1
          fi
          size="$(stat -c %s "${apk}")"
          if ((size < 1024 * 1024)); then
            echo "::error::${apk} is only ${size} bytes; that is not a real APK" >&2
            exit 1
          fi
          echo "debug APK: ${size} bytes"

  # The release gate decides whether an APK that users cannot install can reach
  # a release (issue #97). Its logic is shell, so it gets real tests here rather
  # than being trusted because it is "just CI glue".
  release-gate:
    name: Release gate (artifact + signing policy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck the release gate scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          # --severity=warning blocks on errors and warnings. Info/style findings
          # are not treated as failures because shellcheck's rule set shifts
          # between releases, which would make this job fail for reasons that
          # have nothing to do with the artifact gate.
          shellcheck --severity=warning \
            scripts/android_release_signing.sh \
            scripts/android_release_artifact_smoke.sh \
            scripts/android_release_verify_signature.sh \
            scripts/production-readiness-check.sh \
            scripts/dev-check.sh \
            scripts/tests/release_workflow_test.sh \
            scripts/tests/android_release_signing_test.sh \
            scripts/tests/apksigner_gate_test.sh \
            scripts/tests/android_release_artifact_smoke_test.sh \
            scripts/tests/run_release_gate_tests.sh
      - name: Run the release gate tests
        run: bash scripts/tests/run_release_gate_tests.sh

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-audit
      - name: Rust dependency audit
        run: cargo audit
      # Workflow hygiene (no pull_request_target, pinned actions, timeouts,
      # declared permissions) is a security property: the workflow file decides
      # what code runs with what secrets. scripts/tests/workflow_hygiene_test.sh
      # asserts it from the parsed YAML, mutation-tested.
      - name: Workflow hygiene
        run: bash scripts/tests/workflow_hygiene_test.sh
      # The canary reads required-checks.json and the workflow files, and
      # decides whether a dead check is reported. Running it only on its weekly
      # schedule would mean a PR could break it and merge, so it runs here too
      # (7s, fixture-only, no network). The 2.5-minute mutation pass stays on the
      # schedule -- see .github/workflows/canary.yml.
      - name: Canary suite
        run: bash scripts/tests/canary_liveness_test.sh

      # Required-checks contract: every ci.yml job must be listed in
      # .github/required-checks.json as required or advisory-with-reason, so a
      # newly added job cannot land unrequired the way the Release gate did
      # (#102). Device-free; see issue #104.
      - name: Required-checks contract
        run: bash scripts/tests/required_checks_test.sh
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json