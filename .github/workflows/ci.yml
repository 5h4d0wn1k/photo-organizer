name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust service
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libsecret-1-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Outdated report
        run: flutter pub outdated
        continue-on-error: true

  # The release gate decides whether an APK that users cannot install can reach
  # a release (issue #97). Its logic is shell, so it gets real tests here rather
  # than being trusted because it is "just CI glue".
  #
  # The gate is fanned out over one job per suite (`release-gate-suites`, below)
  # and `release-gate` is the single required check that aggregates them. A
  # matrix leg is its own check name, so requiring the legs individually would
  # mean adding a ruleset context every time a suite is added -- and a required
  # check that is missing is a check that never blocks. One stable required
  # context (`Release gate (artifact + signing policy)`) is kept while the work
  # inside it runs in parallel. The suite list below must equal the driver's
  # SUITES; scripts/tests/release_workflow_test.sh asserts exactly that, so a
  # suite cannot be added to the driver and silently left out of CI.
  release-gate-suites:
    name: Release gate suite
    runs-on: ubuntu-latest
    # Each leg runs exactly one suite. The mutation legs shard internally: the
    # driver starts every shard concurrently, so a leg is bounded by one shard
    # (~10 minutes), not by the whole pass. The bound only needs to catch a hang.
    timeout-minutes: 30
    strategy:
      # One failed leg must not cancel the others: the whole set has to report,
      # so a single failure cannot hide a second, independent one.
      fail-fast: false
      matrix:
        suite:
          - release_workflow_test.sh
          - android_release_signing_test.sh
          - apksigner_gate_test.sh
          - android_release_artifact_smoke_test.sh
          - windows_release_artifact_smoke_test.sh
          - linux_release_artifact_smoke_test.sh
          - macos_release_artifact_smoke_test.sh
          - macos_release_artifact_mutation_test.sh
          - windows_release_artifact_mutation_test.sh
          - ios_release_artifact_smoke_test.sh
          - ios_release_artifact_mutation_test.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pin the interpreter rather than inheriting whatever python3 the runner
      # image happens to ship. The test dependency is installed from a
      # hash-pinned requirements file with --only-binary=:all:, so the install
      # needs a published wheel. CPython 3.14 has no PyYAML 6.0.2 wheel, and on a
      # fresh 3.14 interpreter pip refuses (correctly) instead of silently
      # compiling the sdist. setup-python gives a fresh interpreter on every run,
      # which is what makes --only-binary meaningful here: an interpreter that
      # already has PyYAML would short-circuit the flags and verify nothing.
      # Pinning 3.13 -- the newest minor with a wheel for this pin -- makes that
      # impossible, and makes a future runner image change unable to alter what
      # these suites run against.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install hash-pinned test dependencies
        run: |
          set -euo pipefail
          # --require-hashes verifies the digest of the artifact pip actually
          # downloads; --only-binary=:all: forbids building from source. A suite
          # must not install its own dependency at test time (issue #136): that
          # made a required check's result depend on the network.
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r scripts/requirements-test.txt
      # The driver is the source of truth for the suite list, so a leg runs the
      # same dispatcher a local full run uses, for exactly one suite. An unknown
      # name is a hard error, so a typo cannot run nothing and report success.
      - name: Run the release gate suite
        run: bash scripts/tests/run_release_gate_tests.sh --only-suite "${{ matrix.suite }}"

  # The aggregate. `needs:` alone is not enough: a job whose dependencies failed
  # is SKIPPED, and a skipped required check is not a red one. `if:
  # !cancelled()` makes this job run even when a leg failed, and the final step
  # then refuses to report success unless every leg succeeded.
  release-gate:
    name: Release gate (artifact + signing policy)
    needs: [release-gate-suites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # See the release-gate-suites job above for why the interpreter is pinned
      # and why the install is hash-verified.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install hash-pinned test dependencies
        run: |
          set -euo pipefail
          # --require-hashes verifies the digest of the artifact pip actually
          # downloads; --only-binary=:all: forbids building from source. A suite
          # must not install its own dependency at test time (issue #136): that
          # made a required check's result depend on the network.
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r scripts/requirements-test.txt
      - name: Shellcheck the release gate scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          # --severity=warning blocks on errors and warnings. Info/style findings
          # are not treated as failures because shellcheck's rule set shifts
          # between releases, which would make this job fail for reasons that
          # have nothing to do with the artifact gate.
          shellcheck --severity=warning \
            scripts/android_release_signing.sh \
            scripts/android_release_artifact_smoke.sh \
            scripts/android_release_verify_signature.sh \
            scripts/production-readiness-check.sh \
            scripts/dev-check.sh \
            scripts/tests/release_workflow_test.sh \
            scripts/tests/android_release_signing_test.sh \
            scripts/tests/apksigner_gate_test.sh \
            scripts/tests/android_release_artifact_smoke_test.sh \
            scripts/tests/run_release_gate_tests.sh \
            scripts/tests/gen_test_requirements_test.sh \
            scripts/tests/suites_offline_test.sh \
            scripts/tests/workflow_hygiene_test.sh \
            scripts/tests/workflow_hygiene_mutation_test.sh \
            scripts/tests/gen_test_requirements_mutation_test.sh \
            scripts/tests/tests_wiring_test.sh \
            scripts/tests/tests_wiring_mutation_test.sh \
            scripts/tests/release_atomic_publish_mutation_test.sh \
            scripts/tests/project_board_workflow_test.sh \
            scripts/tests/project_board_workflow_mutation_test.sh \
            scripts/tests/required_checks_test.sh \
            scripts/macos_release_artifact_smoke.sh \
            scripts/ios_release_artifact_smoke.sh \
            scripts/windows_release_artifact_smoke.sh \
            scripts/linux_release_artifact_smoke.sh \
            scripts/tests/macos_release_artifact_smoke_test.sh \
            scripts/tests/macos_release_artifact_mutation_test.sh \
            scripts/tests/ios_release_artifact_smoke_test.sh \
            scripts/tests/ios_release_artifact_mutation_test.sh \
            scripts/tests/windows_release_artifact_smoke_test.sh \
            scripts/tests/windows_release_artifact_mutation_test.sh \
            scripts/tests/linux_release_artifact_smoke_test.sh \
      # This is what makes the required check mean "every release-gate suite
      # passed": `needs.release-gate-suites.result` is `success` only when every
      # matrix leg succeeded. A failed leg makes it `failure`; a leg skipped
      # because the whole run was cancelled is already excluded by the job's
      # `if: !cancelled()`.
      - name: Require every release-gate suite to have passed
        env:
          RELEASE_GATE_SUITES_RESULT: ${{ needs.release-gate-suites.result }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_GATE_SUITES_RESULT}" != "success" ]]; then
            printf '::error::the release-gate suites did not all pass (result: %s); refusing to report the release gate green\n' "${RELEASE_GATE_SUITES_RESULT}" >&2
            exit 1
          fi
          printf 'every release-gate suite passed\n'

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # See the identical step in the release-gate job for why the interpreter
      # is pinned and why the install is hash-verified.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install hash-pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r scripts/requirements-test.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit
      - name: Rust dependency audit
        run: cargo audit
      # Workflow hygiene (no pull_request_target, pinned actions, timeouts,
      # declared permissions) is a security property: the workflow file decides
      # what code runs with what secrets. scripts/tests/workflow_hygiene_test.sh
      # asserts it from the parsed YAML, mutation-tested.
      - name: Workflow hygiene
        run: bash scripts/tests/workflow_hygiene_test.sh
      # 3.6s. Proves the hygiene assertions above actually fail when the
      # workflow files or dependabot.yml drift. Without it, "the pins are
      # checked" is a claim about a comment rather than about behaviour.
      - name: Test-suite wiring
        run: bash scripts/tests/tests_wiring_test.sh
      - name: Workflow hygiene mutation pass
        run: bash scripts/tests/workflow_hygiene_mutation_test.sh
      # The canary reads required-checks.json and the workflow files, and
      # decides whether a dead check is reported. Running it only on its weekly
      # schedule would mean a PR could break it and merge, so it runs here too
      # (7s, fixture-only, no network). The 2.5-minute mutation pass stays on the
      # schedule -- see .github/workflows/canary.yml.
      - name: Canary suite
        run: bash scripts/tests/canary_liveness_test.sh

      # Required-checks contract: every ci.yml job must be listed in
      # .github/required-checks.json as required or advisory-with-reason, so a
      # newly added job cannot land unrequired the way the Release gate did
      # (#102). Device-free; see issue #104.
      - name: Required-checks contract
        run: bash scripts/tests/required_checks_test.sh
      # The test dependency is declared, hash-pinned and installed once above
      # (issue #136). These two prove the declaration is load-bearing rather than
      # decorative:
      #   - the generator refuses to emit a lockfile it cannot vouch for, and the
      #     committed file is exactly what it emits;
      #   - no suite reaches PyPI at test time, proven by interposing a python3
      #     that records and refuses every pip call. Without that, a suite could
      #     quietly reinstall its own dependency and a required check's verdict
      #     would depend on the network again.
      - name: Hash-pinned test dependencies
        run: |
          set -euo pipefail
          bash scripts/tests/gen_test_requirements_test.sh
          bash scripts/tests/suites_offline_test.sh
      # A mutation pass that is not itself run is decoration. `bash -c true` in its
      # place was demonstrated to leave a mutation pass reporting green while its
      # suite had stopped running at all, and the suite above is what would have
      # caught that -- if anything had. The two mutation passes run offline, in
      # seconds, and they are the reason the assertions above can be believed.
      - name: Mutation passes
        run: |
          set -euo pipefail
          bash scripts/tests/gen_test_requirements_mutation_test.sh
          bash scripts/tests/release_atomic_publish_mutation_test.sh
          bash scripts/tests/tests_wiring_mutation_test.sh
          bash scripts/tests/workflow_hygiene_mutation_test.sh
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json