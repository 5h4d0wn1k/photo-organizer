name: Scorecard supply-chain security

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: ["main"]

permissions: read-all

# Superseded runs are pure waste for these read/annotate jobs: none
# deploys, publishes, or mutates release state, so a newer run always
# obsoletes an older one on the same ref. (release.yml deliberately keeps
# cancel-in-progress: false -- a release must never be cancelled mid-flight.)
concurrency:
  # `github.event_name` is load-bearing, not decoration. This workflow is
  # reachable by both `schedule` and `push`, and both run on the default branch,
  # so `github.ref` alone puts them in the same group -- and with
  # `cancel-in-progress: true` a push to main would cancel an in-flight weekly
  # scan, or vice versa. A cancelled scan uploads no SARIF and calls
  # `publish_results: true` for nothing, so the loss is silent: the scorecard
  # simply does not update that week. Asserted by `concurrency-scope` in
  # scripts/tests/workflow_hygiene_test.sh.
  group: scorecard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload Scorecard results to security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif