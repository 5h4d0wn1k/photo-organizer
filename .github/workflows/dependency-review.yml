name: Dependency Review

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Superseded runs are pure waste for these read/annotate jobs: none
# deploys, publishes, or mutates release state, so a newer run always
# obsoletes an older one on the same ref. (release.yml deliberately keeps
# cancel-in-progress: false -- a release must never be cancelled mid-flight.)
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high