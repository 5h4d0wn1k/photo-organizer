name: Schedule canary

# A check that cannot report its own absence is not a check. Two things in
# this repo can die silently:
#
#  1. A `schedule:`-triggered workflow (Scorecard, Stale) that stops running --
#     disabled schedule, renamed file, deleted workflow. There is no run, so
#     there is no failure, and the security check is simply gone.
#  2. Drift between .github/required-checks.json (the reviewable contract,
#     issue #104) and what CI actually enforces. GITHUB_TOKEN cannot read
#     branch protection, so this job cannot verify the "required" flag
#     itself; what it CAN verify with its own token is that every
#     contract-required check has a recent successful run on the default
#     branch -- i.e. the job exists, runs, and passes. The required flag
#     stays owner-verified (see #102); this canary proves the other half.
#
# Runs weekly, plus on demand via workflow_dispatch. Fails loudly on either
# condition. Needs only contents: read.

on:
  schedule:
    # Monday 05:00 UTC -- after the Sunday-night Scorecard/Stale schedules.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Scheduled workflows and contract checks are alive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check scheduled workflows ran recently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Every workflow with a schedule: trigger must have produced a
          # completed run in the last 10 days. A missing run means the schedule
          # died (disabled, renamed, deleted) and nobody was told -- the exact
          # failure this canary exists to catch.
          failures=0
          for workflow in $(python3 -c "
          import glob, yaml
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              d = yaml.safe_load(open(f))
              # Bare 'on:' parses as boolean True under YAML 1.1; read both.
              on = d.get(True, d.get('on', {}))
              if isinstance(on, dict):
                  triggers = set(on)
              elif isinstance(on, list):
                  triggers = set(on)
              elif isinstance(on, str):
                  triggers = {on}
              else:
                  triggers = set()
              if 'schedule' in triggers:
                  print(f.split('/')[-1])
          "); do
            # The canary itself is excluded: its own absence is reported by its
            # own absence, which no check can observe. Its liveness is proven
            # the same way as the others' -- by a run existing -- and a human
            # looking at the Actions tab.
            if [[ "${workflow}" == "canary.yml" ]]; then
              continue
            fi
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=1&event=schedule" \
              --jq '.workflow_runs[0] | "\(.created_at) \(.conclusion)"' 2>/dev/null || echo 'none')"
            echo "${workflow}: latest schedule run: ${latest}"
            if [[ "${latest}" == "none" ]] || [[ "${latest}" == "null "* ]]; then
              echo "::error::${workflow} has no schedule-triggered runs; its schedule is dead or the file was renamed"
              failures=$((failures + 1))
            fi
          done
          if ((failures > 0)); then
            echo "::error::${failures} scheduled workflow(s) show no recent runs"
            exit 1
          fi
          echo "all scheduled workflows have recent runs"
      - name: Check contract-required checks run and pass on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # For every context in required[] (+ pending[] entries whose source
          # exists, i.e. already merged): the default branch HEAD must carry a
          # successful check run with that name. This proves the job exists,
          # executes, and passes -- the half of the guarantee a token without
          # admin scope can verify. It does NOT prove the check is marked
          # required in the ruleset; that half is owner-verified per #102.
          head_sha="$(git rev-parse HEAD)"
          failures=0
          while IFS=$'\t' read -r context; do
            [[ -n "${context}" ]] || continue
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${context}\") | .conclusion] | first // \"absent\"" \
              2>/dev/null || echo "api-error")"
            echo "${context}: ${conclusion}"
            if [[ "${conclusion}" != "success" ]]; then
              echo "::error::contract check '${context}' is '${conclusion}' on main HEAD; the contract and CI disagree"
              failures=$((failures + 1))
            fi
          done < <(python3 -c "
          import json
          contract = json.load(open('.github/required-checks.json'))
          for entry in contract.get('required', []):
              print(entry['context'])
          ")
          if ((failures > 0)); then
            exit 1
          fi
          echo "all contract-required checks are green on main HEAD"
