name: Semantic PR

on:
  # `pull_request`, not `pull_request_target`. This job only reads the PR title
  # through the API; it needs nothing from the base repository, so the privileged
  # target trigger -- which runs fork code with base-repo secrets access -- is
  # unnecessary privilege and a standing injection vector. (The trigger was first
  # suspected as the cause of issue #103, but bisecting proved the actual cause
  # was the `with: types:` flow list below; the trigger change stands on least
  # privilege alone.)
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Validate title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A block scalar, not a flow list. The action expects custom types as
        # a newline-delimited string; a YAML sequence here is schema-invalid and
        # GitHub rejects the whole workflow at registration with zero jobs --
        # that was the actual cause of issue #103 (not the trigger, which was a
        # red herring for the failure but still fixed for least privilege).
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
