name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

# Superseded runs are pure waste for these read/annotate jobs: none
# deploys, publishes, or mutates release state, so a newer run always
# obsoletes an older one on the same ref. (release.yml deliberately keeps
# cancel-in-progress: false -- a release must never be cancelled mid-flight.)
concurrency:
  group: labeler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true