name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Fail in seconds, and before any job holds `contents: write`.
  #
  # Every job that builds a platform `needs:` this one -- five of them, and the
  # platform timeouts are 120 minutes for linux/windows/android and 150 for
  # macos/ios -- so a tag with no signing material fails here instead of after
  # two and a half hours of builds. That is only true because those `needs:`
  # exist: an earlier draft of this file left the platform jobs independent,
  # which made the "seconds, not hours" claim false while still reading true.
  #
  # The signing policy already lives in exactly one place
  # (scripts/android_release_signing.sh), and the `android` job runs it. What that
  # did not do was run it *early*: a tag with no signing material used to burn a
  # checkout, a Rust toolchain and the entire Flutter SDK before failing, and the
  # other four platform jobs, which had no `needs:` either, could not be held back
  # by that failure.
  #
  # v0.1.7 is the observed instance of the shape that lets through. In run
  # 35839417899 the Android, Windows and macOS jobs were green and Linux and iOS
  # failed; the release still went live, non-draft, became "Latest", and carried
  # exactly those three assets -- no AppImage, no .deb, no .app. Checked against
  # the release's own asset list (all three of v0.1.5/6/7 carried
  # app-release.apk, the macOS .dmg and the Windows .zip), not inferred. The
  # defect is the shape -- a tag consumed by a partial release -- not which
  # platform happens to fail.
  #
  # This job is the same script with the same inputs and no toolchain, so it
  # cannot drift from the policy it mirrors. It prints the resolved mode and
  # nothing else; no secret value reaches a command line or the log.
  release-signing-preflight:
    name: Android release signing preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert Android release signing material is complete
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRIVATE_GALLERY_RELEASE_ALLOW_EPHEMERAL_SIGNING: ${{ vars.PRIVATE_GALLERY_RELEASE_ALLOW_EPHEMERAL_SIGNING }}
        run: |
          set -euo pipefail
          # `mode` exits non-zero, with the full setup instructions on stderr and
          # nothing on stdout, when no signing material is configured and the
          # ephemeral opt-in is off -- and when the four secrets are only
          # partially set, which is never silently ignored.
          mode="$(bash scripts/android_release_signing.sh mode | tail -n 1)"
          case "${mode}" in
            release)
              ;;
            ephemeral)
              echo "::warning::Signing with an ephemeral per-run CI key. This release installs once, but any future version requires an uninstall first, which discards the device's paired identity."
              ;;
            *)
              echo "::error::android_release_signing.sh returned an unexpected mode: '${mode}'" >&2
              exit 1
              ;;
          esac
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (AppImage + .deb)
    # Fail fast: a missing keystore must not cost five long platform builds.
    needs:
      - release-signing-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install hermetic toolchain (BEFORE flutter caches CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            liblzma-dev \
            cmake \
            ninja-build \
            g++ \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            pkg-config \
            libfuse2t64

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Build Rust daemon
        run: cargo build --manifest-path native_core/Cargo.toml --bin galleryd --release --locked

      - name: Hermetic CMake cache regen (drop stale CMAKE_CXX_COMPILER pin)
        run: |
          rm -rf app/build/linux
          flutter build linux
        working-directory: app

      - name: Assemble release bundle with wrapper
        run: |
          set -euo pipefail
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          # Copy daemon and ml_sidecar into the Flutter bundle (mirrors build_linux_release.sh)
          cp target/release/galleryd "${BUNDLE_DIR}/galleryd"
          chmod +x "${BUNDLE_DIR}/galleryd"
          rm -rf "${BUNDLE_DIR}/ml_sidecar"
          cp -R ml_sidecar "${BUNDLE_DIR}/ml_sidecar"
          chmod +x "${BUNDLE_DIR}/ml_sidecar/private_gallery_ml_sidecar.py"
          # Launch wrapper (static file; no inline scripts)
          cp assets/linux/AppRun "${BUNDLE_DIR}/AppRun"
          chmod +x "${BUNDLE_DIR}/AppRun"

      - name: Download appimagetool
        run: |
          set -euo pipefail
          # Pinned to the 1.9.1 release (not the rolling "continuous" tag) and
          # verified against its published sha256: record the digest for provenance.
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          # Sanity: artifact is a real ELF binary and has meaningful size.
          test -s appimagetool-x86_64.AppImage
          test "$(stat -c %s appimagetool-x86_64.AppImage)" -gt 1000000
          file -b appimagetool-x86_64.AppImage | grep -qi 'elf'

      - name: Package AppImage
        run: |
          set -euo pipefail
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          APPDIR="AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}"
          # Flat layout: AppRun, private_gallery_app, galleryd, ml_sidecar, .desktop, icon
          cp -R "${BUNDLE_DIR}"/. "${APPDIR}"/
          cp assets/linux/AppRun "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"
          cp assets/linux/photo-organizer.desktop "${APPDIR}/photo-organizer.desktop"
          cp assets/linux/photo-organizer.png "${APPDIR}/photo-organizer.png"
          cp assets/linux/photo-organizer.png "${APPDIR}/.DirIcon"
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage "${APPDIR}" "photo-organizer-linux-x86_64-${GITHUB_REF_NAME}.AppImage"

      - name: Package .deb
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="photo-organizer_${VERSION}_amd64"
          mkdir -p "${PKG}/DEBIAN" "${PKG}/opt/photo-organizer" "${PKG}/usr/share/applications" "${PKG}/usr/share/icons/hicolor/512x512/apps"
          printf '%s\n' \
            "Package: photo-organizer" \
            "Version: ${VERSION}" \
            "Architecture: amd64" \
            "Maintainer: Photo Organizer <5h4d0wn1k@users.noreply.github.com>" \
            "Description: Local-first, private-by-default photo and video library" \
            > "${PKG}/DEBIAN/control"
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          cp -R "${BUNDLE_DIR}"/. "${PKG}/opt/photo-organizer"/
          cp assets/linux/AppRun "${PKG}/opt/photo-organizer/AppRun"
          chmod +x "${PKG}/opt/photo-organizer/AppRun"
          cp assets/linux/photo-organizer.png "${PKG}/usr/share/icons/hicolor/512x512/apps/photo-organizer.png"
          # Desktop entry for the system .deb uses an absolute Exec
          sed 's|^Exec=.*|Exec=/opt/photo-organizer/AppRun|' assets/linux/photo-organizer.desktop \
            > "${PKG}/usr/share/applications/photo-organizer.desktop"
          mkdir -p "${PKG}/usr/bin"
          ln -s /opt/photo-organizer/AppRun "${PKG}/usr/bin/photo-organizer"
          dpkg-deb --build "${PKG}" "photo-organizer_${VERSION}_amd64.deb"

      # The SBOM is generated BEFORE the upload. On origin/main the two were in
      # this order and the artifact was published, so the release shipped it.
      # Moving the SBOM below the upload while consolidating publication silently
      # dropped it, because nothing re-listed it: `docs/RELEASE_CHECKLIST.md` still
      # requires an SBOM from CI and no test mentioned it, so the regression was
      # invisible to both review and CI.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-artifacts
          path: |
            photo-organizer-linux-x86_64-*.AppImage
            photo-organizer_*_amd64.deb
            sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            photo-organizer-linux-x86_64-*.AppImage
            photo-organizer_*_amd64.deb

  windows:
    name: Windows (ZIP)
    # Fail fast: a missing keystore must not cost five long platform builds.
    needs:
      - release-signing-preflight
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Build Rust daemon
        run: cargo build --manifest-path native_core/Cargo.toml --bin galleryd --release --locked

      - name: Build Flutter Windows
        env:

          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows
        working-directory: app

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          $ver = $ref.TrimStart('v')
          $releaseDir = "app/build/windows/x64/runner/Release"
          # Copy daemon and ml_sidecar into Release
          Copy-Item "target/release/galleryd.exe" -Destination $releaseDir -Force
          Copy-Item -Recurse -Path "ml_sidecar" -Destination $releaseDir -Force
          # Compress
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "photo-organizer-windows-x64-$ref.zip" -Force
          Write-Host "Created: photo-organizer-windows-x64-$ref.zip"
          Write-Host "Note: unsigned build"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-artifact
          path: photo-organizer-windows-x64-*.zip

  macos:
    name: macOS (DMG)
    # Fail fast: a missing keystore must not cost five long platform builds.
    needs:
      - release-signing-preflight
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Build Rust daemon
        run: cargo build --manifest-path native_core/Cargo.toml --bin galleryd --release --locked

      - name: Build Flutter macOS
        run: flutter build macos
        working-directory: app

      - name: Package macOS DMG
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          APP_PATH="app/build/macos/Build/Products/Release/private_gallery_app.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "App not found at expected path: ${APP_PATH}" >&2
            ls -la app/build/macos/Build/Products/Release/ 2>&1 || true
            exit 1
          fi
          # Copy daemon and ml_sidecar into app bundle Contents/MacOS
          cp target/release/galleryd "${APP_PATH}/Contents/MacOS/galleryd"
          chmod +x "${APP_PATH}/Contents/MacOS/galleryd"
          rm -rf "${APP_PATH}/Contents/MacOS/ml_sidecar"
          cp -R ml_sidecar "${APP_PATH}/Contents/MacOS/ml_sidecar"
          chmod +x "${APP_PATH}/Contents/MacOS/ml_sidecar/private_gallery_ml_sidecar.py"
          # Create DMG
          hdiutil create -volname "Photo Organizer" -srcfolder "${APP_PATH}" -ov -format UDZO "photo-organizer-macos-${REF_NAME}.dmg"
          echo "Note: unsigned build; no notarization performed."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-artifact
          path: photo-organizer-macos-*.dmg

  android:
    name: Android (APK)
    # Fail fast: a missing keystore must not cost five long platform builds.
    needs:
      - release-signing-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # This job only builds and uploads; `release` owns the publication.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve Android release signing material (BEFORE the NDK build, so a missing secret fails in seconds)
        id: signing
        # The signing policy lives in exactly one place
        # (scripts/android_release_signing.sh) so the workflow, the local
        # readiness check and the tests cannot drift apart.
        #
        # Without signing material this step FAILS the release. That is the whole
        # point of #97: the previous workflow happily published a completely
        # unsigned APK, which stock Android refuses with "App not installed".
        # A throwaway key is available, but only when the repository variable
        # PRIVATE_GALLERY_RELEASE_ALLOW_EPHEMERAL_SIGNING is explicitly enabled,
        # because an ephemeral key cannot install over a previous release.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRIVATE_GALLERY_RELEASE_ALLOW_EPHEMERAL_SIGNING: ${{ vars.PRIVATE_GALLERY_RELEASE_ALLOW_EPHEMERAL_SIGNING }}
        run: |
          set -euo pipefail
          # The script writes ANDROID_KEYSTORE_* into $GITHUB_ENV and prints the
          # resolved mode on stdout (release | ephemeral).
          mode="$(bash scripts/android_release_signing.sh materialize | tail -n 1)"
          case "${mode}" in
            release) ;;
            ephemeral)
              echo "::warning::Signing with an ephemeral per-run CI key. This artifact installs, but a future release cannot install over it without an uninstall, which discards the paired-device identity."
              ;;
            *)
              echo "::error::Unexpected signing mode '${mode}'"
              exit 1
              ;;
          esac

      - name: Hermetic Android NDK cross-compile (cargo-ndk, vendored sqlcipher-openssl; no vcpkg)
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/android/app/src/main/jniLibs \
            build --manifest-path native_core/Cargo.toml --bin galleryd --release --locked
          mkdir -p app/android/app/src/main/assets
          cp -R ml_sidecar app/android/app/src/main/assets/ml_sidecar

      - name: Build Flutter Android APK (signed)
        # Signing material arrives via $GITHUB_ENV from the step above, so no
        # secret is referenced here and none can be echoed into the log.
        run: flutter build apk --release
        working-directory: app

      - name: Verify APK signature (hard gate)
        # Fail the release if the emitted APK is unsigned or signature-scheme
        # incomplete. A signed-but-incomplete APK installs on a modern phone and
        # fails on an older one, so the schemes are asserted explicitly instead
        # of trusting the exit status alone: `apksigner verify` returns 0 for a
        # v2-only APK, which the release notes would still describe as v3.
        #
        # The logic lives in a committed script so it is reviewable, testable
        # and shared with scripts/tests/apksigner_gate_test.sh, which runs these
        # exact assertions against real signed APKs.
        run: |
          set -euo pipefail
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          bash scripts/android_release_verify_signature.sh \
            "${APK}" apksigner-verify.txt app-release.apk.sha256

      # Stage the three files into ONE directory, then upload that directory.
      #
      # Listing the files separately does not produce a flat artifact.
      # actions/upload-artifact documents that "if multiple paths are provided as
      # input, the least common ancestor of all the search paths will be used as
      # the root directory of the artifact". The LCA of
      # `app/build/app/outputs/flutter-apk/app-release.apk` and the two bare
      # filenames at the workspace root is the workspace root, so the APK lands at
      # `apk/app/build/app/outputs/flutter-apk/app-release.apk` after download --
      # not `apk/app-release.apk`, which is what the smoke gate and the publish
      # step both use. Every release would have failed the smoke gate on a missing
      # file. Uploading a single directory removes the ambiguity entirely: the
      # artifact root is that directory, so the layout is exactly what is staged.
      #
      # The copy is verified rather than trusted, so a missing or empty input fails
      # here instead of surfacing later as a confusing downstream error.
      - name: Stage Android artifact
        run: |
          set -euo pipefail
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          mkdir -p dist
          for pair in \
            "${APK}:app-release.apk" \
            "app-release.apk.sha256:app-release.apk.sha256" \
            "apksigner-verify.txt:apksigner-verify.txt"; do
            src="${pair%%:*}"
            dst="dist/${pair##*:}"
            if [[ ! -s "${src}" ]]; then
              echo "::error::refusing to stage a missing or empty file: ${src}" >&2
              exit 1
            fi
            cp "${src}" "${dst}"
          done
          ls -l dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-artifact
          # A single directory, so the artifact root is `dist` and the files land
          # flat. Do not "simplify" this back to a multi-path list.
          path: dist
          if-no-files-found: error

      # Remove the materialized signing key from the runner.
      #
      # `materialize` deliberately leaves the keystore on disk -- the Gradle build
      # is a later process and reads it via ANDROID_KEYSTORE_FILE from $GITHUB_ENV
      # -- so deleting it there would break the build. The runner is ephemeral, but
      # "ephemeral" is a weaker guarantee than it sounds: the file survives a
      # cancelled run's diagnostic steps, a failed build, and any later step that
      # can read RUNNER_TEMP. It is the release key when the four secrets are
      # configured, so it is removed as soon as the build no longer needs it.
      #
      # `if: always()` so it also runs on a failed or cancelled build, which is
      # exactly when a naive `rm` after the build would be skipped. Not
      # `continue-on-error`: a keystore that cannot be removed is worth seeing.
      - name: Remove the materialized signing key
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_FILE:-}" ]]; then
            echo "no signing key was materialized; nothing to remove"
            exit 0
          fi
          if [[ -e "${ANDROID_KEYSTORE_FILE}" ]]; then
            # Overwrite before unlinking so the key bytes are not left recoverable
            # in free space. `shred` is unavailable on some runners, so this is
            # best-effort: the unlink is the part that must happen.
            if command -v shred >/dev/null 2>&1; then
              shred --force --remove "${ANDROID_KEYSTORE_FILE}" 2>/dev/null || rm -f "${ANDROID_KEYSTORE_FILE}"
            else
              rm -f "${ANDROID_KEYSTORE_FILE}"
            fi
            echo "removed the materialized signing key"
          else
            echo "the signing key was already absent"
          fi

        # NOTE: publication is intentionally NOT done here. This job only builds and
        # uploads the APK. `android-verify` re-derives its checksum and signature,
        # and the single `release` job publishes it -- only after the install+launch
        # gate has passed. There is no `android-publish` job any more: it never
        # published, and never could have published atomically.
        #
        # It never ran because it had `needs: [android, android-smoke]` and no steps
        # of its own beyond checkout/download/verify/publish -- the signing steps
        # lived here, in `android`. `android` itself had no `needs:`, and its
        # `actions/checkout` pin was unresolvable (`3d3d42e5...`, `d` for `c`, HTTP
        # 422), so every `v*` tag died in `android` and took this job with it. That
        # was #133, fixed in #134. Runs for v0.1.5/6/7 list only the five platform
        # jobs and predate the split entirely.

  # Installability + launchability gate for the Android artifact. Runs the EXACT
  # APK that will be published, on a real Android system image, before any release
  # is cut. Any install/launch/crash/render failure exits non-zero and blocks the
  # release.
  android-smoke:
    name: Android install+launch smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: android
    permissions:
      contents: read
    strategy:
      # One leg failing must not cancel the other: both results are evidence, and
      # a partial matrix is more useful for diagnosis than a cancelled one.
      fail-fast: false
      matrix:
        # API 30 exercises the legacy permission/storage path near minSdk 24;
        # API 35 exercises the modern (Android 13+ granular media permission) path
        # that most current phones actually run, close to targetSdk 36.
        api-level: [30, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download built APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: android-artifact
          path: apk

      - name: Install, cold-launch, detect crash, capture evidence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SMOKE_NAME: android-smoke-api${{ matrix.api-level }}
          ANDROID_SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/android-smoke-evidence
        # MUST stay a single line. This action splits its `script` input on
        # newlines and runs each line as an independent `sh -c`, which breaks
        # control flow, drops variables between lines, and cannot use
        # `set -o pipefail` (dash has no pipefail). All logic therefore lives in
        # a committed, locally tested bash script.
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # google_apis (not AOSP) because the app ships mobile_scanner, which is
          # backed by ML Kit and needs Google Play services — matching real phones.
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: ${{ github.workspace }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/scripts/android_release_artifact_smoke.sh" "$GITHUB_WORKSPACE/apk/app-release.apk"

      - name: Upload smoke evidence (screenshot, crash buffer, exit-info, logs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-smoke-evidence-api${{ matrix.api-level }}
          path: android-smoke-evidence/
          # `error`, not `warn`. Evidence is a required half of the drop-gate
          # ("evidenced on the runner harness"), so evidence that is silently
          # absent is a gate failure. A missing evidence dir can only happen when
          # the gate step already failed or the wiring above is wrong; in both
          # cases the job is red either way, so this cannot mask a real result.
          if-no-files-found: error

  # Re-verify the Android APK only after BOTH the signed build and the
  # install+launch gate are green. This is the actual "no un-installable APK
  # ships" guarantee (#97).
  #
  # This job does NOT publish. It used to, which meant it was the only platform
  # whose bytes were re-checked immediately before upload -- a property worth
  # keeping. With the single `release` job it keeps that property for the same
  # reason it had it: `release` needs this job, so it cannot attach the APK
  # until this re-verification is green. The check is not weakened by moving the
  # upload; it is still a hard `needs:` edge, and it is still a third independent
  # check on a different runner with a different checkout.
  android-verify:
    name: Android (verify APK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [android, android-smoke]
    permissions:
      # Verification only. This job has no business creating or updating a
      # release, and dropping `contents: write` here means a future step added
      # to this job cannot publish even by accident.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download built APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: android-artifact
          path: apk

      # Re-verify the artifact in the job that actually publishes it.
      #
      # The build job already runs the signature gate and the smoke job already
      # installed the APK, so this is a *third* independent check. That redundancy
      # is the point: `release` `needs:` this job, so nothing is published unless
      # this passed, and it is a different job on a different runner with a
      # different checkout of the gate script.
      #
      # It is NOT the last check before the bytes become a download -- `release`
      # still downloads five artifact sets and stages them afterwards. What it does
      # guarantee is that the artifact verified here is the one `release` stages:
      # both fetch the same immutable `android-artifact` from this same run.
      #
      # The checksum is verified first because it is the cheap, total check on the
      # bytes: it fails if the file was modified, truncated, or is not the file the
      # build produced. The signature gate then re-asserts v2+v3 on exactly those
      # bytes. Nothing here is a substitute for the build-job checks; it is the
      # narrowest possible proof that what is about to be published is what was
      # verified.
      - name: Re-verify the artifact about to be published
        run: |
          set -euo pipefail
          APK="apk/app-release.apk"
          if [[ ! -s "${APK}" ]]; then
            echo "::error::refusing to release: ${APK} is missing or empty" >&2
            exit 1
          fi
          if [[ ! -s "apk/app-release.apk.sha256" ]]; then
            echo "::error::refusing to release: the checksum file is missing or empty" >&2
            exit 1
          fi
          # `sha256sum -c` needs the file to be named exactly as the digest line
          # says, which it is: the build job writes the bare filename precisely so
          # a user can run the same command.
          ( cd apk && sha256sum -c app-release.apk.sha256 )
          # The gate re-derives its own evidence and checksum into a scratch
          # directory rather than over the published ones: it is verifying, not
          # regenerating, so it must not be able to make a bad artifact look
          # attested by replacing the file a reader is told to trust. The build
          # job's `apksigner-verify.txt` is the one that ships.
          scratch="$(mktemp -d)"
          bash scripts/android_release_verify_signature.sh \
            "${APK}" "${scratch}/reverify.txt" "${scratch}/reverify.sha256"
          # Assert the re-verification actually reached the certificate rather than
          # stopping at "Verifies": the digest is what a reader uses to compare
          # this release against the last one, so its absence must be a failure
          # here and not a surprise for whoever tries that comparison.
          if ! grep -qE 'certificate SHA-256 digest' "${scratch}/reverify.txt"; then
            echo "::error::re-verification produced no signing certificate digest" >&2
            exit 1
          fi
          rm -rf "${scratch}"
          echo "re-verified the artifact about to be published"

  linux-smoke:
    name: Linux install+launch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: linux
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            xauth \
            imagemagick \
            x11-utils \
            libfuse2t64 \
            dbus-x11

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: linux-artifacts
          path: linux-artifacts

      - name: Run Linux artifact smoke gate
        env:
          LINUX_SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/linux-smoke-evidence
        run: |
          set -euo pipefail
          mkdir -p "${LINUX_SMOKE_EVIDENCE_DIR}"
          bash scripts/linux_release_artifact_smoke.sh linux-artifacts

      - name: Upload Linux smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-smoke-evidence
          path: linux-smoke-evidence/
          if-no-files-found: error

  windows-smoke:
    name: Windows install+launch smoke
    runs-on: windows-latest
    timeout-minutes: 60
    needs: windows
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: windows-artifact
          path: windows-artifact

      - name: Run Windows artifact smoke gate
        shell: bash
        env:
          WINDOWS_SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/windows-smoke-evidence
        run: |
          set -euo pipefail
          mkdir -p "${WINDOWS_SMOKE_EVIDENCE_DIR}"
          # Find the ZIP
          ZIP="$(find windows-artifact -name "*.zip" -type f | head -n 1)"
          if [[ -z "${ZIP}" ]]; then
            echo "No ZIP found in windows-artifact" >&2
            exit 1
          fi
          bash scripts/windows_release_artifact_smoke.sh "${ZIP}"

      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-smoke-evidence
          path: windows-smoke-evidence/
          if-no-files-found: error

  macos-smoke:
    name: macOS install+launch smoke
    runs-on: macos-latest
    timeout-minutes: 45
    needs: macos
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download macOS artifact for smoke
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: macos-artifact
          path: macos-artifact

      - name: Run macOS artifact smoke gate
        env:
          MACOS_SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/macos-smoke-evidence
        run: |
          set -euo pipefail
          mkdir -p "${MACOS_SMOKE_EVIDENCE_DIR}"
          # Mount and launch the exact published DMG, not a rebuilt bundle.
          DMG="$(find macos-artifact -name '*.dmg' -type f | head -n 1)"
          if [[ -z "${DMG}" ]]; then
            echo "No DMG found in macos-artifact" >&2
            exit 1
          fi
          bash scripts/macos_release_artifact_smoke.sh "${DMG}"

      - name: Upload macOS smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-smoke-evidence
          path: macos-smoke-evidence/
          if-no-files-found: error

  ios:
    name: iOS (unsigned .app)
    # Fail fast: a missing keystore must not cost five long platform builds.
    needs:
      - release-signing-preflight
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Hermetic iOS cross-compile (device + simulator + host slices; vendored sqlcipher-openssl)
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          # Device slice: shipped in the release .app (aarch64-apple-ios).
          cargo build --manifest-path native_core/Cargo.toml --bin galleryd --release --target aarch64-apple-ios --locked
          # Simulator slice: installed into the simulator .app the gate inspects.
          cargo build --manifest-path native_core/Cargo.toml --bin galleryd --release --target aarch64-apple-ios-sim --locked
          # Host slice: the real backend the launched simulator app is pointed at.
          cargo build --manifest-path native_core/Cargo.toml --bin galleryd --release --locked

      - name: Build Flutter iOS (unsigned, no codesign)
        run: flutter build ios --release --no-codesign
        working-directory: app

      - name: Package unsigned .app
        run: |
          set -euo pipefail
          APP_PATH="app/build/ios/iphoneos/Runner.app"
          mkdir -p "${APP_PATH}/Frameworks"
          cp -R target/aarch64-apple-ios/release/galleryd "${APP_PATH}/Frameworks/race"
          cp -R ml_sidecar "${APP_PATH}/ml_sidecar"
          ditto -c -k --keepParent "${APP_PATH}" "photo-organizer-ios-${GITHUB_REF_NAME}.zip"

      # The device .app above is an `iphoneos` bundle: `simctl install` cannot
      # accept it, so the only iOS surface a free runner can prove is the
      # simulator slice. It is built here, in the same job, and the gate below is
      # a release blocker -- if it fails, nothing publishes.
      #
      # iOS forbids an app from spawning galleryd, so unlike the desktop gates
      # the backend cannot be the in-bundle daemon. Instead this job starts a host
      # galleryd, initializes a vault and pairs a session, then hands the session
      # to the debug build through IOS_SMOKE_LAUNCH_ARGUMENTS. AppDelegate serves
      # those arguments over `private_gallery/launch_invite` (compiled out of
      # release builds), the app calls GET /mobile/workspace, and the probe below
      # fails unless the daemon logged that call. No harness step issues it, so a
      # hit can only be the launched app.
      - name: "Build Flutter iOS simulator slice (Debug; launch transport is #if DEBUG)"
        working-directory: app
        run: |
          set -euo pipefail
          # No --release: Flutter rejects combining --simulator with --release,
          # and the injected-session transport is compiled only when DEBUG is
          # defined, which the simulator Debug config sets.
          flutter build ios --simulator
          SIM_APP="build/ios/iphonesimulator/Runner.app"
          test -d "${SIM_APP}"
          mkdir -p "${SIM_APP}/Frameworks"
          cp -R ../target/aarch64-apple-ios-sim/release/galleryd "${SIM_APP}/Frameworks/race"
          cp -R ../ml_sidecar "${SIM_APP}/ml_sidecar"

      - name: iOS simulator install/launch/render + backend gate
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/ios-smoke"
          EVIDENCE="${GITHUB_WORKSPACE}/ios-smoke-evidence"
          rm -rf "${WORK}" "${EVIDENCE}"
          mkdir -p "${WORK}" "${EVIDENCE}"

          export PRIVATE_GALLERY_LIBRARY_ROOT="${WORK}/library"
          export PRIVATE_GALLERY_RUNTIME_ROOT="${WORK}/runtime"
          export PRIVATE_GALLERY_BIND_HOST=127.0.0.1
          export PRIVATE_GALLERY_BIND_PORT=4821
          # tower_http logs each request (with its uri) at debug; without this the
          # probe has nothing to read and would fail even though the app did reach
          # us, which is a false negative this job must not produce.
          export RUST_LOG="info,tower_http=debug"
          target/release/galleryd >"${WORK}/galleryd.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "${daemon_pid}" 2>/dev/null || true' EXIT

          BASE="http://127.0.0.1:4821"
          for _ in $(seq 1 60); do
            curl -fsS "${BASE}/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "${BASE}/health" >/dev/null

          # A fresh daemon has no vault and pairing answers 404 until one exists,
          # so initialize the library before asking for a pairing session.
          curl -fsS -X POST "${BASE}/library/settings" \
            -H 'content-type: application/json' \
            -d "$(jq -nc --arg root "${WORK}/library" \
              '{library_root:$root, default_import_mode:"copy", original_storage_policy:"encrypted_only"}')" \
            >/dev/null

          pairing_json="$(curl -fsS -X POST "${BASE}/pairing/sessions" \
            -H 'content-type: application/json' \
            -d "$(jq -nc '{device_name:"ios-sim-gate", platform:"ios"}')")"
          pairing_token="$(jq -r '.pairing_token' <<<"${pairing_json}")"
          test -n "${pairing_token}" && test "${pairing_token}" != "null"
          pair_resp="$(curl -fsS -X POST "${BASE}/mobile/pair" \
            -H 'content-type: application/json' \
            -d "$(jq -nc --arg t "${pairing_token}" \
              '{pairing_token:$t, device_name:"ios-sim-gate", platform:"ios"}')")"
          bearer="$(jq -r '.bearer_token' <<<"${pair_resp}")"
          test -n "${bearer}" && test "${bearer}" != "null"

          # The probe answers only "did the launched app reach the backend". It
          # reads the daemon log for a path no harness step issues. Written with
          # printf so the shebang lands in column 0 (the gate execs it directly).
          probe="${WORK}/backend-probe.sh"
          printf '#!/usr/bin/env bash\nset -euo pipefail\ngrep -F %s %s\n' \
            "'/mobile/workspace'" "'${WORK}/galleryd.log'" >"${probe}"
          chmod +x "${probe}"

          export IOS_SMOKE_EVIDENCE_DIR="${EVIDENCE}"
          export IOS_SMOKE_LAUNCH_ARGUMENTS="--private-gallery-desktop-url ${BASE} --private-gallery-bearer-token ${bearer}"
          export IOS_SMOKE_BACKEND_PROBE="${probe}"
          bash scripts/ios_release_artifact_smoke.sh "app/build/ios/iphonesimulator/Runner.app"

      - name: Upload iOS smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-smoke-evidence
          path: ios-smoke-evidence/
          if-no-files-found: error

      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-artifact
          path: photo-organizer-ios-*.zip

  # The one and only job that creates or updates the release.
  #
  # Previously each platform job published itself, with no `needs:` between them
  # and `contents: write` on five of them (linux, windows, macos, ios, and
  # android-publish). The release action creates the release when it does not
  # exist, so a tag where any subset of those jobs failed still produced a live,
  # public, non-draft release carrying whatever the successful jobs had uploaded,
  # and it became "Latest". The tag was consumed. Nothing asserted against that
  # shape.
  #
  # v0.1.7 is the observed instance: run 35839417899 had Android, Windows and
  # macOS green, Linux and iOS red, and published exactly those three assets.
  #
  # Now nothing can publish until every platform job and the signing preflight is
  # green, so a release is either complete or it does not exist.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
      # Deliberately NO `if: always()`. That condition is what #82 proposed, and
      # it is the opposite of what atomic publication needs: `always()` runs the
      # job *even when its dependencies failed*, which is precisely how a
      # four-platform release escapes while Android is red. With no `if`, GitHub
      # runs this job only when every entry in `needs` succeeded, and skips it
      # otherwise -- which is the guarantee.
      #
      # Every entry is listed explicitly rather than reusing a group, so that
      # adding an ARTIFACT-PRODUCING platform without adding it here fails the suite.
      # Narrower than it looks: a job that uploads no artifact has nothing to stage,
      # so adding one without listing it here is not caught -- correct, because there
      # is no artifact to omit, but do not read this as "every new job must be listed".
    needs:
      - release-signing-preflight
      - linux
      - linux-smoke
      - windows
      - windows-smoke
      - macos
      - macos-smoke
      - ios
      - android-verify
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One download step per artifact, each into its own directory.
      #
      # Downloading by name rather than by `pattern:` is deliberate. A pattern
      # that matched nothing would still succeed, so a renamed or mis-uploaded
      # artifact would silently contribute zero files to the release. Naming
      # them one by one makes each absence a hard failure at the step, before
      # any staging happens.
      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: android-artifact
          path: incoming/android

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: linux-artifacts
          path: incoming/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: windows-artifact
          path: incoming/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: macos-artifact
          path: incoming/macos

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: ios-artifact
          path: incoming/ios

      # Flatten into one directory and prove the set is complete before a single
      # byte is uploaded.
      #
      # Two failure modes are handled explicitly, and both were reachable in the
      # old workflow:
      #
      #   * a platform contributing zero files -- previously that platform just
      #     published an empty set and the release looked fine;
      #   * two artifacts sharing a basename -- `action-gh-release` uploads by
      #     basename, so one would silently overwrite the other and the release
      #     would carry the wrong bytes under a plausible name.
      #
      # Staging by hand rather than trusting the action's own glob behaviour also
      # means `dist/*` is a literal, reviewable file list in the logs, and the
      # suite can assert on it.
      - name: Stage every platform artifact, refusing an incomplete set
        run: |
          set -euo pipefail
          platforms=(android linux windows macos ios)
          missing=()
          for platform in "${platforms[@]}"; do
            dir="incoming/${platform}"
            if [[ ! -d "${dir}" ]]; then
              missing+=("${platform}: no directory")
              continue
            fi
            count="$(find "${dir}" -type f -size +0c | wc -l)"
            if [[ "${count}" -eq 0 ]]; then
              missing+=("${platform}: no non-empty file")
            fi
          done
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::refusing to publish a partial release:" >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

          rm -rf dist
          mkdir -p dist
          for platform in "${platforms[@]}"; do
            while IFS= read -r file; do
              base="$(basename "${file}")"
              if [[ -e "dist/${base}" ]]; then
                echo "::error::refusing to publish: ${base} is produced by more than one platform and would overwrite the other" >&2
                exit 1
              fi
              cp "${file}" "dist/${base}"
            done < <(find "incoming/${platform}" -type f -size +0c)
          done

          echo "staged $(find dist -type f | wc -l) files from ${#platforms[@]} platforms:"
          ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          # The action's own default is `fail_on_unmatched_files: false`, which means
          # it CREATES a release with zero assets when the glob matches nothing. That
          # is exactly the v0.1.7 outcome this change exists to prevent: a live,
          # public release that a user can see is missing every platform. Set to true,
          # so if staging produced nothing the step fails instead.
          #
          # This is deliberately independent of the staging step's own exit code. A
          # reviewer showed that adding `continue-on-error: true` to the staging step
          # re-opens the same hole while every other check stays green: the refusal
          # exits 1, GitHub marks the step failed-but-continued, the job succeeds,
          # `dist` was never created (the `rm -rf dist` is *after* the refusal), and
          # the glob matches nothing. The suite now asserts no step in `release` sets
          # `continue-on-error`, and this key is the second, independent line.
          fail_on_unmatched_files: true
          # One publish call, so `append_body` is not needed and the
          # "last job wins the body" race that made per-platform signing warnings
          # disappear is structurally impossible rather than guarded against.
          # Dropping it is a deliberate behaviour change on one path: re-running
          # this workflow for a tag that already has a release now REPLACES the
          # body instead of appending a second copy of the signing block. For a
          # single writer, replace-on-rerun is the correct semantics; append would
          # duplicate the notes on every retry.
          generate_release_notes: true
          body: |
            ## Signing status per platform

            * **Android** — signed. Verified with `apksigner` (APK Signature Scheme
              v2 and v3; v1/JAR is off because minSdk is 24) in CI, twice: once in
              the build job and again in `android-verify`, which `release` needs.
              ${{ needs.release-signing-preflight.outputs.signing_mode == 'release' && 'This artifact is signed with the project release key, so future versions install over it without an uninstall.' || 'This artifact is signed with an ephemeral per-run CI key, so it installs once but a future version will require uninstalling it first — which discards this device’s paired identity.' }}
              **Install:** sideload it -- enable "install unknown apps" for your file manager,
              then open the APK and confirm. There is no store listing.
              Verify the download with the attached `app-release.apk.sha256`.
            * **Linux** — unsigned. No GPG signature and no Debian package signing.
            * **Windows** — unsigned. No Authenticode signing.
            * **macOS** — unsigned. No notarization.
            * **iOS** — unsigned `.app`, no codesign. Install via sideload tools or
              sign with your own Apple identity. No notarization, no App Store claim.

            ## Installability evidence

            Every platform artifact is install/launch-gated in CI before it can be
            published: the `release` job needs each platform's smoke job, so a
            build that fails its gate cannot have been published.

            * **Android** — installed and cold-launched on real Android system
              images (API 30 and API 35): install, cold launch, a stable
              visually-complex frame, and a clean crash buffer / ApplicationExitInfo.
            * **Linux** — the packaged artifact is installed, the daemon cold-launched
              and its window attributed to the process on a headless X server.
            * **Windows** — the packaged artifact is installed and the daemon
              cold-launched on a native Windows runner.
            * **macOS** — the published DMG is mounted and the `.app` inside it is
              installed and launched on a macOS runner.
            * **iOS** — the simulator slice of the same app is installed,
              cold-launched and rendered on an iPhone Simulator, and a debug build
              is proven to reach a host backend. The shipped device `.app` is an
              `iphoneos` bundle that `simctl` cannot install; it is built and
              packaged, not install-tested.

            What those checks do **not** prove, stated plainly so they are not read
            as a stronger guarantee than they are:

            * The Android images are x86_64. The arm64-v8a and armeabi-v7a slices
              are checked structurally by reading the archive before the device is
              touched, not by installing them on arm hardware.
            * On API 31+ the system splash is drawn inside the app's own window, so a
              stable focused frame does not by itself prove the app's own UI painted.
            * The desktop gates prove install, launch and process/window health, not
              feature behaviour; the iOS gate runs the simulator build, not the
              device build on real hardware.
            * A signed release can only be proven installable over the *previous*
              signed release by sideloading it onto a device that already has it.
              CI has no such device; that check is manual and is listed in
              docs/RELEASE_CHECKLIST.md.
