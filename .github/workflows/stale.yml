name: Stale

on:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale items
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 90
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: roadmap,security,help wanted,good first issue
          exempt-pr-labels: roadmap,security
          exempt-draft-pr: true
          stale-issue-message: This issue is stale because it has been open for 90 days with no activity. Remove the stale label or comment, or it will close in 30 days.
          stale-pr-message: This pull request is stale because it has been open for 90 days with no activity. Remove the stale label or comment, or it will close in 30 days.
          close-issue-message: This issue was closed because it has been inactive for 30 days after being marked stale.
          close-pr-message: This pull request was closed because it has been inactive for 30 days after being marked stale.
          operations-per-run: 100