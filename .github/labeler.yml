rust:
  - changed-files:
      - "native_core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

flutter:
  - changed-files:
      - "app/**"

python:
  - changed-files:
      - "ml_sidecar/**"
      - "scripts/**/*.py"

ci:
  - changed-files:
      - ".github/workflows/*.yml"

security:
  - changed-files:
      - ".github/workflows/codeql-analysis.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/scorecard.yml"
      - "docs/SECURITY_GATES_TRIAGE.md"
      - "SECURITY.md"

docs:
  - changed-files:
      - "*.md"
      - "docs/**"

deps:
  - changed-files:
      - ".github/dependabot.yml"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - "ml_sidecar/requirements*.txt"

devcontainer:
  - changed-files:
      - ".devcontainer/**"