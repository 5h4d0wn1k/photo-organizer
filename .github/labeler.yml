rust:
  - changed-files:
      - any-glob-to-any-file:
          - "native_core/**"
          - "Cargo.toml"
          - "Cargo.lock"
          - "rust-toolchain.toml"

flutter:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"

android:
  - changed-files:
      - any-glob-to-any-file:
          - "app/android/**"
          - "app/linux/**"
          - "app/lib/**/*android*"
          - "app/lib/**/*linux*"
          - "app/lib/platform/**"

python:
  - changed-files:
      - any-glob-to-any-file:
          - "ml_sidecar/**"
          - "scripts/**/*.py"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/*.yml"

security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/codeql-analysis.yml"
          - ".github/workflows/dependency-review.yml"
          - ".github/workflows/scorecard.yml"
          - "docs/SECURITY_GATES_TRIAGE.md"
          - "SECURITY.md"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"

deps:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - "**/Cargo.lock"
          - "**/Cargo.toml"
          - "app/pubspec.yaml"
          - "app/pubspec.lock"
          - "ml_sidecar/requirements*.txt"

devcontainer:
  - changed-files:
      - any-glob-to-any-file:
          - ".devcontainer/**"