rust:
  - "native_core/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"

flutter:
  - "app/**"

python:
  - "ml_sidecar/**"
  - "scripts/**/*.py"

ci:
  - ".github/workflows/*.yml"

security:
