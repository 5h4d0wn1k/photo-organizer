version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - deps
      - ci
    groups:
      # `update-types` is the load-bearing line, not tidiness. With a bare
      # `patterns: ["*"]` Dependabot puts every github-actions bump into one PR
      # regardless of how far it moves, so a four-major-version jump of an
      # action used in the release-signing path can arrive sitting next to
      # two-line patch bumps -- where nobody reads it. That is not hypothetical:
      # it is exactly what PR #128 did to actions/download-artifact
      # (4.1.8 -> 8.0.1). See #130.
      #
      # Grouping only minor+patch keeps routine weeks at one PR, while a major
      # bump arrives on its own, where the upstream release notes are the whole
      # story and the change is reviewable as a change.
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/native_core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - deps
      - rust
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - deps
      - flutter
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/ml_sidecar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - deps
      - python
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]